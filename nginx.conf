server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  # .glb는 mime 항목이 없어 octet-stream으로 나간다. 안이 이진이라도 gzip이 잘 먹는다
  gzip_types application/javascript text/css application/json application/octet-stream;

  # html과 코드는 매번 재검증한다. 옛 코드가 캐시된 채 새 에셋을 요청하면 게임이 깨진다
  location ~* \.(html|js)$ {
    add_header Cache-Control "no-store";
  }

  # 에셋은 내용이 바뀌면 파일명이 바뀌므로 오래 캐시해도 된다
  location /assets/ {
    add_header Cache-Control "public, max-age=604800";
  }
}
