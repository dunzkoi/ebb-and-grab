server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  # .glb는 mime 항목이 없어 octet-stream으로 나간다. 안이 이진이라도 gzip이 잘 먹는다
  gzip_types application/javascript text/css application/json application/octet-stream;

  # 버전이 고정된 것들은 오래 캐시한다 (^~ 가 아래 정규식 블록보다 우선)
  location ^~ /vendor/ { add_header Cache-Control "public, max-age=604800"; }
  location ^~ /assets/ { add_header Cache-Control "public, max-age=604800"; }

  # 게임 코드와 html은 캐시하지 않는다.
  # 옛 코드가 캐시된 채 새 에셋을 요청하면 게임이 404로 죽는다.
  # CDN이 no-cache를 4시간 캐시로 덮어써서 no-store를 쓴다.
  location ~* \.(html|js)$ { add_header Cache-Control "no-store"; }
}
